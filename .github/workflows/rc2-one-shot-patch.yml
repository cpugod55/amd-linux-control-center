name: RC2 one-shot source patch

on:
  push:
    branches:
      - rc2-development
    paths:
      - .github/rc2-trigger

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RC2 branch
        uses: actions/checkout@v4
        with:
          ref: rc2-development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded RC2 source patch
        run: python .github/scripts/rc2_patch_main.py

      - name: Compile application modules
        run: python -m compileall -q app

      - name: Run test suite
        run: python -m pytest -q

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/amd_linux_control_center.py
          git commit -m "RC2: persist fan controls and improve tuning clarity"
          git push origin HEAD:rc2-development
